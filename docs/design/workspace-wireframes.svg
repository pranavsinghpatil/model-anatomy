<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title description">
<title id="title">Model Anatomy desktop and mobile workspace wireframes</title><desc id="description">Annotated panel hierarchy, responsive inspector navigation, graph controls and evidence tabs. All boxes illustrate interface structure, not model data.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172126;font-size:16px}.small{font-size:13px;fill:#52616b}.heading{font-size:26px;font-weight:600}.title{font-size:18px;font-weight:600}.surface{fill:#fff;stroke:#c6d2d7}.soft{fill:#edf2f3;stroke:#c6d2d7}.accent{fill:#e0f0ec;stroke:#0f766e}.line{stroke:#0f766e;stroke-width:2;fill:none}</style>
<rect width="1440" height="860" fill="#f5f7f8"/><text class="heading" x="40" y="48">Inspection workspace · layout specification</text><text class="small" x="40" y="76">Interface wireframes only. No model architecture or report is represented.</text>
<text class="title" x="40" y="120">Desktop ≥ 1280px</text><rect class="surface" x="40" y="140" width="970" height="570" rx="8"/>
<rect class="soft" x="40" y="140" width="970" height="58" rx="8"/><text x="60" y="176">Model switcher · status</text><text x="568" y="176">Mode · theme · new · export</text>
<path d="M40 245H1010" stroke="#c6d2d7"/><text x="60" y="228">Overview    Architecture    Artifacts    Report</text>
<rect class="soft" x="40" y="245" width="190" height="465"/><text class="title" x="60" y="277">Components</text><text class="small" x="60" y="305">240px initial width</text><text class="small" x="60" y="337">Current graph list</text><text class="small" x="60" y="365">Separate nested action</text><text class="small" x="60" y="393">Keyboard selection</text>
<rect class="soft" x="710" y="245" width="300" height="465"/><text class="title" x="730" y="277">Inspector</text><text class="small" x="730" y="305">360px initial width</text><text class="small" x="730" y="341">Component · Tensors · Evidence</text><text class="small" x="730" y="385">Purpose and shapes first</text><text class="small" x="730" y="413">Raw records in disclosures</text><text class="small" x="730" y="441">Independent panel scrolling</text>
<path class="line" d="M231 245V710M709 245V710"/><text class="small" x="252" y="275">Breadcrumbs · panel controls</text><rect class="accent" x="250" y="295" width="438" height="44" rx="5"/><text class="small" x="264" y="323">Current-graph search · fit · readable view</text>
<text class="title" x="334" y="485">Architecture canvas</text><text class="small" x="291" y="515">Selection opens details; explicit action opens children.</text><text class="small" x="296" y="543">Connections expose ports, shape and provenance.</text><text class="small" x="250" y="686">Zoom / minimap / relation labels</text>
<text class="small" x="40" y="748">① Compact global controls    ② URL owns primary view    ③ Resizable separators preserve context</text><text class="small" x="40" y="776">④ At 1024–1279px, Components moves into a focus-trapped drawer; Inspector remains docked.</text><text class="small" x="40" y="804">⑤ Artifacts and Report use full-width scrollable views rather than competing with the graph.</text>
<text class="title" x="1060" y="120">Mobile &lt; 1024px</text><rect class="surface" x="1060" y="140" width="330" height="570" rx="8"/><rect class="soft" x="1060" y="140" width="330" height="90" rx="8"/><text class="small" x="1080" y="172">Model · status</text><text class="small" x="1080" y="205">Mode · theme · new · export</text><text class="small" x="1076" y="257">Overview  Architecture  Artifacts  Report</text><path d="M1060 275H1390" stroke="#c6d2d7"/>
<text x="1080" y="310">← Back to graph</text><text class="title" x="1080" y="355">Selected component</text><text class="small" x="1080" y="388">Component · Tensors · Evidence</text><rect class="accent" x="1080" y="412" width="290" height="112" rx="5"/><text class="small" x="1096" y="442">Purpose</text><text class="small" x="1096" y="471">Input / output shape</text><text class="small" x="1096" y="500">Reported facts</text><text class="small" x="1080" y="564">Component list opens as a drawer.</text><text class="small" x="1080" y="593">Selection replaces the canvas view.</text><text class="small" x="1080" y="622">Back restores graph and viewport.</text><text class="small" x="1060" y="748">⑥ Clear return navigation</text><text class="small" x="1060" y="776">⑦ Bounded tables scroll within their view</text><text class="small" x="1060" y="804">⑧ Learn uses the same inspected facts</text>
</svg>
