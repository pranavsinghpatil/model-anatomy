name: quality

on:
  pull_request:
    branches: [main, b-mvp]
  push:
    branches: [main, b-mvp]

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[api,dev]'
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: pytest -q
      - name: Lint API boundary
        run: ruff check backend/model_anatomy/api backend/tests/test_api.py
