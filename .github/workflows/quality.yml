name: quality

on:
  pull_request:
    branches: [main, b-mvp]
  push:
    branches: [main, b-mvp]

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        uses: astral-sh/setup-uv@v6
      - name: Install locked CPU dependencies
        run: uv sync --frozen --extra api --extra engine --extra dev
      - name: Compile
        run: uv run --no-sync python -m compileall -q backend
      - name: Tests
        run: uv run --no-sync pytest -q
      - name: Lint
        run: uv run --no-sync ruff check backend
