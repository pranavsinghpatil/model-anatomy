[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-anatomy"
version = "0.1.0"
description = "Reconstruct Hugging Face models into semantic architecture graphs"
requires-python = ">=3.11"
dependencies = [
  "huggingface_hub>=0.27",
  "torch>=2.4",
  "transformers>=4.45",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["backend"]
