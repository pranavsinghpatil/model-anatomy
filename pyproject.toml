[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-anatomy"
version = "0.1.0"
description = "Reconstruct Hugging Face models into semantic architecture graphs"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "transformers>=4.45",
  "safetensors>=0.4",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.27,<1",
]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27,<1"]

[project.scripts]
model-anatomy-api = "model_anatomy.api.__main__:main"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py311"
src = ["backend"]

[tool.setuptools.packages.find]
where = ["backend"]
