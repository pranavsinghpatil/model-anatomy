[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-anatomy"
version = "0.1.0"
description = "Reconstruct Hugging Face models into semantic architecture graphs"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.27,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
]
engine = ["torch>=2.8,<3", "transformers>=4.57,<5", "safetensors>=0.4,<1"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27,<1"]

[project.scripts]
model-anatomy = "model_anatomy.src.cli:main"
model-anatomy-api = "model_anatomy.api.__main__:main"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = ["integration: real Hugging Face metadata inspection (network required)"]

[tool.ruff]
target-version = "py311"
src = ["backend"]
line-length = 110

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.setuptools.packages.find]
where = ["backend"]
